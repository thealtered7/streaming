# Server configuration
server.port=8080

# Application name
spring.application.name=streaming

# Database configuration (can be overridden by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/geo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:streaming_geo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:streaming_geo_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
# Using 'update' to allow Hibernate to manage schema changes while respecting pre-created tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging configuration (additional properties if needed)
logging.level.com.keene.streaming=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR