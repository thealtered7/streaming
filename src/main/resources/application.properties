# Server configuration
server.port=8080

# Application name
spring.application.name=streaming

# Database configuration (can be overridden by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/geo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:streaming_geo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:streaming_geo_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
# Using 'update' to allow Hibernate to manage schema changes while respecting pre-created tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Generate DDL scripts from entities
# This will create schema.sql and drop-schema.sql files in the build directory
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=build/ddl/schema.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-source=metadata

# Timezone configuration - use UTC
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging configuration (additional properties if needed)
logging.level.com.keene.streaming=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR